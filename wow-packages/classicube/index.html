<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClassiCube</title>
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #141a20; color: #fff; font: 16px system-ui, sans-serif; }
    canvas { display: block; border: 0; padding: 0; outline: 0; }
    #welcome { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: #1c2c36; }
    #welcome[hidden] { display: none; }
    button { justify-self: center; font: inherit; padding: .5rem 1.5rem; cursor: pointer; }
    #load { position: absolute; left: .8rem; bottom: .5rem; background: #141a20; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="ClassiCube 游戏画面"></canvas>
  <section id="welcome">
    <h1>ClassiCube</h1>
    <p>WASD 移动，鼠标转向。按 Esc，在 Save level 和 Load level 中保存或读取地图。</p>
    <button id="start" type="button">进入单人世界</button>
  </section>
  <span id="load" role="status"></span>
  <script>
    const canvas = document.getElementById('canvas');
    const load = document.getElementById('load');
    var Module = {
      arguments: ['WinOnWeb'],
      canvas,
      print: console.log,
      printErr: console.error,
      setStatus(text) { load.textContent = text; },
      onAbort() { load.textContent = '游戏启动失败，请重新打开窗口。'; }
    };
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    function resizeGameCanvas() {
      const width = Math.round(canvas.clientWidth * devicePixelRatio);
      const height = Math.round(canvas.clientHeight * devicePixelRatio);
      if (width && height && (canvas.width !== width || canvas.height !== height)) {
        canvas.width = width;
        canvas.height = height;
      }
    }
    resizeGameCanvas();
    window.addEventListener('resize', resizeGameCanvas);
    document.getElementById('start').addEventListener('click', () => {
      document.getElementById('welcome').hidden = true;
      canvas.focus();
      const script = document.createElement('script');
      script.src = './classicube.js';
      script.onerror = () => { load.textContent = '无法加载 ClassiCube 客户端。'; };
      document.body.append(script);
    }, { once: true });
  </script>
</body>
</html>
