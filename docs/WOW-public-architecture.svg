<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" width="1440" height="1080" role="img" aria-labelledby="title desc">
  <title id="title">WinOnWeb (WOW) 浏览器元操作系统全景架构</title>
  <desc id="desc">自下而上展示浏览器本地算力底座、WOW 无头内核、运行时与协议、以及上层桌面外壳、.wow 开放生态与用户自托管远控节点（ExHyperV / scrcpy）。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f9fc"/>
      <stop offset="100%" stop-color="#edf2f8"/>
    </linearGradient>
    <linearGradient id="halBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14293d"/>
      <stop offset="100%" stop-color="#1f3b57"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1080" fill="url(#bg)"/>

  <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
    <!-- 顶部标题 -->
    <text x="56" y="76" font-size="44" font-weight="700" fill="#102438">WinOnWeb (WOW) 架构全景</text>
    <text x="58" y="114" font-size="21" fill="#4b637a">纯浏览器本地算力运行 · 开放 Web/Wasm 应用生态 · 可直连用户自己的虚拟机与手机</text>
    <rect x="1144" y="42" width="240" height="44" rx="22" fill="#e2effe" stroke="#b6d4fe"/>
    <text x="1264" y="71" font-size="18" font-weight="600" fill="#1557b0" text-anchor="middle">零中心服务器算力成本</text>

    <!-- L4 用户态：外壳 + 应用生态 + 远程自托管节点 -->
    <rect x="56" y="144" width="1328" height="232" rx="18" fill="#ffffff" stroke="#cddae6" stroke-width="1.5"/>
    <text x="82" y="184" font-size="24" font-weight="700" fill="#1557b0">L4 · 用户态：桌面外壳 &amp; 多元应用生态</text>
    <text x="515" y="183" font-size="16" fill="#637b92">（Win11 只是默认外壳，可自由替换）</text>

    <!-- L4 卡片1 -->
    <rect x="82" y="204" width="300" height="148" rx="12" fill="#f4f8ff" stroke="#c7dbf3" stroke-width="1.5"/>
    <text x="104" y="238" font-size="21" font-weight="700" fill="#102438">桌面外壳 &amp; 系统工具</text>
    <text x="104" y="270" font-size="16" fill="#42586e">• 窗口管理 / 任务栏 / 开始菜单</text>
    <text x="104" y="298" font-size="16" fill="#42586e">• 资源管理器 / 任务管理器</text>
    <text x="104" y="326" font-size="16" fill="#42586e">• 设置 / 应用商店 / 记事本</text>

    <!-- L4 卡片2 -->
    <rect x="404" y="204" width="460" height="148" rx="12" fill="#f0fbf7" stroke="#b6e2d3" stroke-width="1.5"/>
    <text x="426" y="238" font-size="21" font-weight="700" fill="#0f5c4d">开放 .wow 应用生态（本地浏览器跑）</text>
    <text x="426" y="270" font-size="16" fill="#325c53">• 标准前端：HTML / CSS / JS / TS / React / Vue 通用</text>
    <text x="426" y="298" font-size="16" fill="#325c53">• 重型原生移植：C / C++ / Rust / C# 编译到 Wasm</text>
    <text x="426" y="326" font-size="16" fill="#325c53">• AI 极速造应用：打包成 .wow (ZIP) 即可离线安装</text>

    <!-- L4 卡片3 -->
    <rect x="886" y="204" width="474" height="148" rx="12" fill="#fff7f0" stroke="#f3cfb0" stroke-width="1.5"/>
    <text x="908" y="238" font-size="21" font-weight="700" fill="#9a4a0c">用户自托管远控（零作者服务器压力）</text>
    <text x="908" y="270" font-size="16" fill="#6d4728">• ExHyperV 虚拟机转发：直连你自己的 Win/Linux VM</text>
    <text x="908" y="298" font-size="16" fill="#6d4728">• 未来接入 scrcpy：浏览器窗口直接操控安卓手机</text>
    <text x="908" y="326" font-size="16" fill="#6d4728">• 算力在你自己设备/电脑上，WOW 只做统一操控台</text>

    <!-- 箭头 L3 -> L4 -->
    <path d="M720 408 V380 M713 388 L720 380 L727 388" fill="none" stroke="#688097" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- L3 运行时与协议层 -->
    <rect x="56" y="408" width="1328" height="132" rx="18" fill="#ffffff" stroke="#cddae6" stroke-width="1.5"/>
    <text x="82" y="446" font-size="24" font-weight="700" fill="#514ca3">L3 · 系统调用与多态运行时 (wow/v1 协议)</text>
    <rect x="82" y="464" width="405" height="56" rx="10" fill="#f5f4fe" stroke="#d5d1f6"/>
    <text x="284" y="498" font-size="17" font-weight="600" fill="#2d2966" text-anchor="middle">Builtin Runtime（系统内置应用直连）</text>

    <rect x="510" y="464" width="420" height="56" rx="10" fill="#f5f4fe" stroke="#d5d1f6"/>
    <text x="720" y="498" font-size="17" font-weight="600" fill="#2d2966" text-anchor="middle">Iframe Sandbox + /wow/apps/{id}/ 隔离运行</text>

    <rect x="953" y="464" width="407" height="56" rx="10" fill="#f5f4fe" stroke="#d5d1f6"/>
    <text x="1156" y="498" font-size="17" font-weight="600" fill="#2d2966" text-anchor="middle">Scoped Syscall 权限代理 (fs/win/ipc/hw/kv)</text>

    <!-- 箭头 L2 -> L3 -->
    <path d="M720 572 V544 M713 552 L720 544 L727 552" fill="none" stroke="#688097" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- L2 无头微内核 -->
    <rect x="56" y="572" width="1328" height="172" rx="18" fill="#eaf5f2" stroke="#aed2c8" stroke-width="1.5"/>
    <text x="82" y="612" font-size="24" font-weight="700" fill="#10655c">L2 · WOW 无头微内核 (Headless Kernel · 零 DOM)</text>

    <rect x="82" y="630" width="242" height="92" rx="10" fill="#ffffff" stroke="#b9dad1"/>
    <text x="100" y="662" font-size="19" font-weight="700" fill="#102438">进程与资源治理</text>
    <text x="100" y="690" font-size="15" fill="#4b637a">PID 生命周期管理</text>
    <text x="100" y="710" font-size="15" fill="#4b637a">关进程自动回收资源</text>

    <rect x="341" y="630" width="242" height="92" rx="10" fill="#ffffff" stroke="#b9dad1"/>
    <text x="359" y="662" font-size="19" font-weight="700" fill="#102438">无头窗口管理器</text>
    <text x="359" y="690" font-size="15" fill="#4b637a">坐标 / 层级 / 焦点</text>
    <text x="359" y="710" font-size="15" fill="#4b637a">贴靠与多窗口状态</text>

    <rect x="600" y="630" width="242" height="92" rx="10" fill="#ffffff" stroke="#b9dad1"/>
    <text x="618" y="662" font-size="19" font-weight="700" fill="#102438">统一虚拟文件系统</text>
    <text x="618" y="690" font-size="15" fill="#4b637a">C 盘虚拟系统与用户盘</text>
    <text x="618" y="710" font-size="15" fill="#4b637a">D 盘映射本机真实目录</text>

    <rect x="859" y="630" width="242" height="92" rx="10" fill="#ffffff" stroke="#b9dad1"/>
    <text x="877" y="662" font-size="19" font-weight="700" fill="#102438">注册表与权限中心</text>
    <text x="877" y="690" font-size="15" fill="#4b637a">.wow 包安装与卸载</text>
    <text x="877" y="710" font-size="15" fill="#4b637a">Capability 能力鉴权</text>

    <rect x="1118" y="630" width="242" height="92" rx="10" fill="#ffffff" stroke="#b9dad1"/>
    <text x="1136" y="662" font-size="19" font-weight="700" fill="#102438">IPC 总线与遥测</text>
    <text x="1136" y="690" font-size="15" fill="#4b637a">跨应用通信与事件广播</text>
    <text x="1136" y="710" font-size="15" fill="#4b637a">硬件性能按需采样</text>

    <!-- 箭头 L1 -> L2 -->
    <path d="M720 776 V748 M713 756 L720 748 L727 756" fill="none" stroke="#688097" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- L1 Browser HAL + 浏览器原生能力 -->
    <rect x="56" y="776" width="1328" height="252" rx="18" fill="url(#halBg)"/>
    <text x="82" y="818" font-size="24" font-weight="700" fill="#ffffff">L1 · Browser HAL &amp; 浏览器本地硬件能力（全部运行在用户设备本地）</text>

    <rect x="82" y="840" width="302" height="162" rx="12" fill="#213d59" stroke="#365a7d"/>
    <text x="104" y="874" font-size="20" font-weight="700" fill="#a8d4ff">存储驱动 (Storage)</text>
    <text x="104" y="906" font-size="15" fill="#d5e4f2">• IndexedDB 离线应用包仓库</text>
    <text x="104" y="934" font-size="15" fill="#d5e4f2">• File System Access 本机目录</text>
    <text x="104" y="962" font-size="15" fill="#d5e4f2">• OPFS 高性能本地文件系统</text>
    <text x="104" y="990" font-size="15" fill="#d5e4f2">• Persist 持久化防清理</text>

    <rect x="406" y="840" width="302" height="162" rx="12" fill="#213d59" stroke="#365a7d"/>
    <text x="428" y="874" font-size="20" font-weight="700" fill="#a8d4ff">本地算力与图形 (Compute)</text>
    <text x="428" y="906" font-size="15" fill="#d5e4f2">• WebAssembly + SharedArrayBuffer</text>
    <text x="428" y="934" font-size="15" fill="#d5e4f2">• WebGPU / WebGL 硬件加速</text>
    <text x="428" y="962" font-size="15" fill="#d5e4f2">• Web Worker 多线程调度</text>
    <text x="428" y="990" font-size="15" fill="#d5e4f2">• 设备硬件探测与资源探针</text>

    <rect x="730" y="840" width="302" height="162" rx="12" fill="#213d59" stroke="#365a7d"/>
    <text x="752" y="874" font-size="20" font-weight="700" fill="#a8d4ff">虚拟分发 (Service Worker)</text>
    <text x="752" y="906" font-size="15" fill="#d5e4f2">• 本地拦截 /wow/apps/{id}/</text>
    <text x="752" y="934" font-size="15" fill="#d5e4f2">• 离线直接从浏览器硬盘启动</text>
    <text x="752" y="962" font-size="15" fill="#d5e4f2">• 精准注入 COOP/COEP 隔离头</text>
    <text x="752" y="990" font-size="15" fill="#d5e4f2">• 纯静态托管，零后端计算开销</text>

    <rect x="1054" y="840" width="306" height="162" rx="12" fill="#213d59" stroke="#365a7d"/>
    <text x="1076" y="874" font-size="20" font-weight="700" fill="#a8d4ff">交互与传输 (I/O &amp; Net)</text>
    <text x="1076" y="906" font-size="15" fill="#d5e4f2">• WebRTC / WebSocket 远控流</text>
    <text x="1076" y="934" font-size="15" fill="#d5e4f2">• PointerLock / 全屏 / 手柄</text>
    <text x="1076" y="962" font-size="15" fill="#d5e4f2">• 安全 postMessage / Channel</text>
    <text x="1076" y="990" font-size="15" fill="#d5e4f2">• 跨芯片跨系统 (Win/Mac/Linux/手机)</text>
  </g>
</svg>
