<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" width="1440" height="1040" role="img" aria-labelledby="title desc">
  <title id="title">WOW 系统架构</title>
  <desc id="desc">WOW 四层浏览器操作系统技术架构：用户态外壳与应用、运行时与 wow/v1 协议、无头微内核、浏览器硬件抽象层与浏览器底座。</desc>

  <rect width="1440" height="1040" fill="#f8fafc"/>

  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <!-- 顶部极简标题 -->
    <text x="56" y="68" font-size="38" font-weight="700" fill="#0f172a">WOW 系统架构</text>
    <text x="58" y="100" font-size="17" fill="#64748b">L4 User Space  →  L3 Runtime &amp; ABI  →  L2 Headless Kernel  →  L1 Browser HAL  →  L0 Browser Platform</text>

    <!-- L4: 用户态 -->
    <rect x="56" y="128" width="1328" height="162" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="80" y="164" font-size="20" font-weight="700" fill="#1d4ed8">L4 · 用户态 (User Space)</text>
    <text x="330" y="163" font-size="14" fill="#64748b">外壳与内核解耦，仅通过 L3 协议与内核交互</text>

    <rect x="80" y="182" width="388" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="98" y="212" font-size="17" font-weight="700" fill="#0f172a">桌面外壳 (Shell UI)</text>
    <text x="98" y="238" font-size="14" fill="#475569">窗口合成 · 桌面网格 · 任务栏 · 开始菜单</text>
    <text x="98" y="258" font-size="14" fill="#475569">系统弹窗与通知注入 (可替换皮肤)</text>

    <rect x="488" y="182" width="424" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="506" y="212" font-size="17" font-weight="700" fill="#0f172a">内置系统组件 (Trusted Builtin)</text>
    <text x="506" y="238" font-size="14" fill="#475569">资源管理器 · 任务管理器 · 应用中心</text>
    <text x="506" y="258" font-size="14" fill="#475569">内置浏览器 · 记事本 · 设置 · 存储实验</text>

    <rect x="932" y="182" width="428" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="950" y="212" font-size="17" font-weight="700" fill="#0f172a">外部应用与客户端</text>
    <text x="950" y="238" font-size="14" fill="#475569">.wow 离线应用 (Web / WebAssembly)</text>
    <text x="950" y="258" font-size="14" fill="#475569">在线 Web 应用 · Hyper-V 远程客户端</text>

    <!-- 箭头 L4 -> L3 -->
    <path d="M720 290 V318 M714 310 L720 318 L726 310" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- L3: 运行时与协议 -->
    <rect x="56" y="320" width="1328" height="148" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="80" y="356" font-size="20" font-weight="700" fill="#6d28d9">L3 · 运行时与系统调用边界 (Runtime &amp; wow/v1)</text>

    <rect x="80" y="374" width="616" height="74" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="98" y="403" font-size="17" font-weight="700" fill="#0f172a">多态运行时加载器 (Runtime Loaders)</text>
    <text x="98" y="429" font-size="14" fill="#475569">BuiltinRuntime (同线程)  |  IframeRuntime (沙箱隔离 / credentialless)  |  Command / WorkerRuntime</text>

    <rect x="716" y="374" width="644" height="74" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="734" y="403" font-size="17" font-weight="700" fill="#0f172a">wow/v1 线协议与 Scoped Syscall Proxy</text>
    <text x="734" y="429" font-size="14" fill="#475569">文档世代握手 · 专属 MessagePort · 方法级鉴权与错误码 · 控制面与数据面分离</text>

    <!-- 箭头 L3 -> L2 -->
    <path d="M720 468 V496 M714 488 L720 496 L726 488" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- L2: 无头微内核 -->
    <rect x="56" y="498" width="1328" height="168" rx="14" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="80" y="534" font-size="20" font-weight="700" fill="#0f766e">L2 · 无头微内核 (Headless Kernel · Zero DOM)</text>

    <rect x="80" y="552" width="244" height="92" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="96" y="581" font-size="16" font-weight="700" fill="#0f172a">Process Manager</text>
    <text x="96" y="605" font-size="13.5" fill="#475569">1 PID → 0..N 窗口解耦</text>
    <text x="96" y="625" font-size="13.5" fill="#475569">吊销授权与受管资源回收</text>

    <rect x="339" y="552" width="244" height="92" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="355" y="581" font-size="16" font-weight="700" fill="#0f172a">View &amp; Focus</text>
    <text x="355" y="605" font-size="13.5" fill="#475569">实例视图归属与层级</text>
    <text x="355" y="625" font-size="13.5" fill="#475569">输入所有权与失焦释放</text>

    <rect x="598" y="552" width="244" height="92" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="614" y="581" font-size="16" font-weight="700" fill="#0f172a">VFS 虚拟文件系统</text>
    <text x="614" y="605" font-size="13.5" fill="#475569">挂载表 (C: / D: / 扩展)</text>
    <text x="614" y="625" font-size="13.5" fill="#475569">统一句柄与明确写入语义</text>

    <rect x="857" y="552" width="244" height="92" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="873" y="581" font-size="16" font-weight="700" fill="#0f172a">Package &amp; Security</text>
    <text x="873" y="605" font-size="13.5" fill="#475569">身份隔离与不可变版本</text>
    <text x="873" y="625" font-size="13.5" fill="#475569">暂存/提交/GC · Capability</text>

    <rect x="1116" y="552" width="244" height="92" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="1132" y="581" font-size="16" font-weight="700" fill="#0f172a">Bus &amp; Telemetry</text>
    <text x="1132" y="605" font-size="13.5" fill="#475569">按 instanceId 精确路由</text>
    <text x="1132" y="625" font-size="13.5" fill="#475569">独立按需硬件遥测服务</text>

    <!-- 箭头 L2 -> L1 -->
    <path d="M720 666 V694 M714 686 L720 694 L726 686" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- L1: Browser HAL -->
    <rect x="56" y="696" width="1328" height="168" rx="14" fill="#1e293b"/>
    <text x="80" y="732" font-size="20" font-weight="700" fill="#e2e8f0">L1 · 浏览器硬件抽象层 (Browser HAL)</text>

    <rect x="80" y="750" width="244" height="92" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="96" y="779" font-size="16" font-weight="700" fill="#93c5fd">Capabilities</text>
    <text x="96" y="803" font-size="13.5" fill="#cbd5e1">环境自检与隔离档位</text>
    <text x="96" y="823" font-size="13.5" fill="#cbd5e1">宿主固件配置读取</text>

    <rect x="339" y="750" width="244" height="92" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="355" y="779" font-size="16" font-weight="700" fill="#93c5fd">Storage Drivers</text>
    <text x="355" y="803" font-size="13.5" fill="#cbd5e1">IDB 元数据 + OPFS 块存储</text>
    <text x="355" y="823" font-size="13.5" fill="#cbd5e1">HostFS 桥接 · Persist / Quota</text>

    <rect x="598" y="750" width="244" height="92" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="614" y="779" font-size="16" font-weight="700" fill="#93c5fd">VHost (SW)</text>
    <text x="614" y="803" font-size="13.5" fill="#cbd5e1">/wow/apps/{id}/v/{hash}/</text>
    <text x="614" y="823" font-size="13.5" fill="#cbd5e1">无状态分发 · Range · 隔离头</text>

    <rect x="857" y="750" width="244" height="92" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="873" y="779" font-size="16" font-weight="700" fill="#93c5fd">Runtime Primitives</text>
    <text x="873" y="803" font-size="13.5" fill="#cbd5e1">Worker 解包与退出钩子</text>
    <text x="873" y="823" font-size="13.5" fill="#cbd5e1">Guest 探针 · 实时硬件采样</text>

    <rect x="1116" y="750" width="244" height="92" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="1132" y="779" font-size="16" font-weight="700" fill="#93c5fd">Platform</text>
    <text x="1132" y="803" font-size="13.5" fill="#cbd5e1">MessageChannel 传输</text>
    <text x="1132" y="823" font-size="13.5" fill="#cbd5e1">全屏 / 指针锁 / 页面生命周期</text>

    <!-- 箭头 L1 -> L0 -->
    <path d="M720 864 V892 M714 884 L720 892 L726 884" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- L0: 浏览器与宿主机能力 -->
    <rect x="56" y="894" width="1328" height="106" rx="14" fill="#0f172a"/>
    <text x="80" y="930" font-size="19" font-weight="700" fill="#f8fafc">L0 · 浏览器与宿主机平台 (Browser Platform)</text>
    <text x="80" y="968" font-size="15" fill="#94a3b8">WebAssembly / SharedArrayBuffer / WebGL / WebGPU / WebNN   ·   OPFS / IndexedDB / File System Access   ·   Service Worker / Web Worker / iframe (COOP + COEP)   ·   WebRTC / WebSocket</text>
  </g>
</svg>
