<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 1032" width="1440" height="1032" role="img" aria-labelledby="heading description"><title id="heading">WinOnWeb 顶层架构</title><desc id="description">自下而上：浏览器提供设备信号、存储与执行环境；WOW 将其抽象为虚拟硬件、文件系统及运行资源；桌面系统服务向任务管理器、资源管理器、设置及其他应用提供能力。</desc><defs><symbol id="ic-chart" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="28" height="28" rx="6"/><path d="M6 19h5l3-9 4 14 3-8h5"/></g></symbol><symbol id="ic-folder" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 24V8a2 2 0 0 1 2-2h8l3 4h11a2 2 0 0 1 2 2v3"/><path d="M4 26l3-11h23l-3 11z"/></g></symbol><symbol id="ic-settings" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="4"/><path d="M13 3h6l1 4 3 1 4-1 3 5-3 3v3l3 3-3 5-4-1-3 2-1 3h-6l-1-4-3-1-4 1-3-5 3-3v-3l-3-3 3-5 4 1 3-2z"/></g></symbol><symbol id="ic-desktop" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="28" height="23" rx="3"/><path d="M2 21h28m-19 3h2m2 0h2m2 0h2"/></g></symbol><symbol id="ic-windows" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="22" height="18" rx="2"/><path d="M3 9h22m-16 17h19V12"/></g></symbol><symbol id="ic-cpu" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="18" height="18" rx="3"/><rect x="12" y="12" width="8" height="8" rx="1"/><path d="M11 3v4m5-4v4m5-4v4M11 25v4m5-4v4m5-4v4M3 11h4m-4 5h4m-4 5h4m18-10h4m-4 5h4m-4 5h4"/></g></symbol><symbol id="ic-disk" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7" rx="12" ry="4"/><path d="M4 7v18c0 5.5 24 5.5 24 0V7M4 16c0 5.5 24 5.5 24 0"/></g></symbol><symbol id="ic-runtime" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="4"/><rect x="21" y="3" width="8" height="8" rx="2"/><rect x="21" y="21" width="8" height="8" rx="2"/><path d="M10 16h5m0-9h6m-6 18h6m-6-18v18"/></g></symbol><symbol id="ic-browser" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="28" height="24" rx="4"/><path d="M2 11h28m-23-4h1m3 0h1"/></g></symbol></defs><rect x="0" y="0" width="1440" height="1032" rx="0" fill="#f4f7fb" stroke="none" stroke-width="1.5"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="48" y="77" font-size="52" fill="#142a43" font-weight="700">WinOnWeb 顶层架构</text><text x="50" y="122" font-size="24" fill="#4a6077" font-weight="400">从浏览器提供的能力，到用户看到的桌面与应用</text><rect x="48" y="154" width="1344" height="181" rx="17" fill="#fff" stroke="#ccd8e4" stroke-width="1.5"/><text x="72" y="197" font-size="27" fill="#235fa4" font-weight="700">桌面与应用</text><rect x="72" y="218" width="312" height="94" rx="11" fill="#f3f8ff" stroke="#c8daee" stroke-width="1.5"/><use href="#ic-chart" xlink:href="#ic-chart" x="86" y="239" width="39" height="39" color="#235fa4"/><text x="138" y="254" font-size="24" fill="#142a43" font-weight="700">任务管理器</text><text x="138" y="284" font-size="18" fill="#4a6077" font-weight="400">进程、性能与资源用量</text><rect x="400" y="218" width="312" height="94" rx="11" fill="#f3f8ff" stroke="#c8daee" stroke-width="1.5"/><use href="#ic-folder" xlink:href="#ic-folder" x="414" y="239" width="39" height="39" color="#235fa4"/><text x="466" y="254" font-size="24" fill="#142a43" font-weight="700">资源管理器</text><text x="466" y="284" font-size="18" fill="#4a6077" font-weight="400">浏览盘符、目录和文件</text><rect x="728" y="218" width="312" height="94" rx="11" fill="#f3f8ff" stroke="#c8daee" stroke-width="1.5"/><use href="#ic-settings" xlink:href="#ic-settings" x="742" y="239" width="39" height="39" color="#235fa4"/><text x="794" y="254" font-size="24" fill="#142a43" font-weight="700">设置</text><text x="794" y="284" font-size="18" fill="#4a6077" font-weight="400">管理桌面偏好与配置</text><rect x="1056" y="218" width="312" height="94" rx="11" fill="#f3f8ff" stroke="#c8daee" stroke-width="1.5"/><use href="#ic-desktop" xlink:href="#ic-desktop" x="1070" y="239" width="39" height="39" color="#235fa4"/><text x="1122" y="254" font-size="24" fill="#142a43" font-weight="700">桌面外壳</text><text x="1122" y="284" font-size="18" fill="#4a6077" font-weight="400">任务栏、开始菜单和窗口</text><path d="M720 367 V338" fill="none" stroke="#657c94" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M713 346 L720 338 L727 346" fill="none" stroke="#657c94" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="367" width="1344" height="159" rx="17" fill="#fff" stroke="#cbd6e5" stroke-width="1.5"/><text x="72" y="410" font-size="27" fill="#514ca3" font-weight="700">桌面系统服务</text><path d="M73 438 v52" fill="none" stroke="#b4afdd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="87" y="456" font-size="22" fill="#142a43" font-weight="700">窗口与应用生命周期</text><text x="87" y="489" font-size="17" fill="#4a6077" font-weight="400">启动、关闭、进程与窗口状态</text><path d="M401 438 v52" fill="none" stroke="#b4afdd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="415" y="456" font-size="22" fill="#142a43" font-weight="700">硬件状态服务</text><text x="415" y="489" font-size="17" fill="#4a6077" font-weight="400">读取快照、订阅性能更新</text><path d="M729 438 v52" fill="none" stroke="#b4afdd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="743" y="456" font-size="22" fill="#142a43" font-weight="700">文件服务</text><text x="743" y="489" font-size="17" fill="#4a6077" font-weight="400">盘符寻址、目录与文件操作</text><path d="M1057 438 v52" fill="none" stroke="#b4afdd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1071" y="456" font-size="22" fill="#142a43" font-weight="700">权限与应用通信</text><text x="1071" y="489" font-size="17" fill="#4a6077" font-weight="400">能力授权、内置 API 与 iframe 消息</text><path d="M720 558 V529" fill="none" stroke="#657c94" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M713 537 L720 529 L727 537" fill="none" stroke="#657c94" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="558" width="1344" height="224" rx="17" fill="#eaf5f2" stroke="#accdc6" stroke-width="1.5"/><text x="72" y="601" font-size="27" fill="#126b62" font-weight="700">WOW 虚拟硬件与系统资源</text><rect x="72" y="624" width="420" height="133" rx="12" fill="#fff" stroke="#bad7d0" stroke-width="1.5"/><use href="#ic-cpu" xlink:href="#ic-cpu" x="88" y="638" width="34" height="34" color="#126b62"/><text x="135" y="665" font-size="24" fill="#142a43" font-weight="700">虚拟硬件</text><text x="89" y="704" font-size="20" fill="#142a43" font-weight="400">CPU、内存、GPU、网络</text><text x="89" y="735" font-size="17" fill="#4a6077" font-weight="400">设备型号识别与性能采样；部分曲线模拟</text><rect x="510" y="624" width="420" height="133" rx="12" fill="#fff" stroke="#bad7d0" stroke-width="1.5"/><use href="#ic-disk" xlink:href="#ic-disk" x="526" y="638" width="34" height="34" color="#126b62"/><text x="573" y="665" font-size="24" fill="#142a43" font-weight="700">虚拟文件系统</text><text x="527" y="704" font-size="20" fill="#142a43" font-weight="400">C 盘虚拟目录树</text><text x="527" y="735" font-size="17" fill="#4a6077" font-weight="400">D 盘映射用户授权的本地目录</text><rect x="948" y="624" width="420" height="133" rx="12" fill="#fff" stroke="#bad7d0" stroke-width="1.5"/><use href="#ic-runtime" xlink:href="#ic-runtime" x="964" y="638" width="34" height="34" color="#126b62"/><text x="1011" y="665" font-size="24" fill="#142a43" font-weight="700">应用运行资源</text><text x="965" y="704" font-size="20" fill="#142a43" font-weight="400">按 WOW 进程归集资源</text><text x="965" y="735" font-size="17" fill="#4a6077" font-weight="400">跟踪 Worker、文件句柄和写入流</text><path d="M720 814 V785" fill="none" stroke="#657c94" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M713 793 L720 785 L727 793" fill="none" stroke="#657c94" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="814" width="1344" height="179" rx="17" fill="#1b3249" stroke="none" stroke-width="1.5"/><use href="#ic-browser" xlink:href="#ic-browser" x="72" y="835" width="33" height="33" color="#a5d3fb"/><text x="119" y="861" font-size="27" fill="#fff" font-weight="700">浏览器与设备能力</text><text x="73" y="916" font-size="23" fill="#e7f2ff" font-weight="700">设备信号</text><text x="73" y="954" font-size="17" fill="#c5d6e6" font-weight="400">浏览器设备信息、WebGL、WebGPU</text><text x="511" y="916" font-size="23" fill="#e7f2ff" font-weight="700">数据与文件</text><text x="511" y="954" font-size="17" fill="#c5d6e6" font-weight="400">IndexedDB、OPFS、本地目录授权</text><text x="949" y="916" font-size="23" fill="#e7f2ff" font-weight="700">执行环境</text><text x="949" y="954" font-size="17" fill="#c5d6e6" font-weight="400">JavaScript、Worker、iframe、Service Worker</text></g></svg>