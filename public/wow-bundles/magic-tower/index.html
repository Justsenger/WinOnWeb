<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>WOW 两层迷宫演示</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#10131b;color:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#37476a 0,#171c2b 42%,#0d1017 100%);display:grid;place-items:center;overflow:auto}
    button{font:inherit;color:inherit;cursor:pointer}#app{width:min(1100px,100vw);min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center}.card{width:min(980px,100%);border:1px solid #526287;background:rgba(19,25,40,.94);border-radius:18px;box-shadow:0 24px 70px #0008;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #34425e;background:#202b43}.brand{font-size:20px;font-weight:700;letter-spacing:.05em}.sub{font-size:12px;color:#aab8d6;margin-top:3px}.start{padding:48px 24px;text-align:center}.tower{font-size:64px;line-height:1;margin-bottom:12px}.start h1{margin:0;font-size:34px}.start p{margin:10px auto 26px;color:#adbad5;max-width:560px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:9px;padding:11px 22px;font-weight:700}.primary{background:#54a6ff;color:#061327}.secondary{background:#303e5d;color:#dbe8ff}.primary:hover,.secondary:hover{filter:brightness(1.15)}.game{display:grid;grid-template-columns:260px 1fr;min-height:620px}.side{padding:20px;border-right:1px solid #34425e;background:#182138}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.stat{background:#101727;border:1px solid #34425e;padding:10px;border-radius:9px}.stat b{display:block;font-size:18px;margin-top:3px;color:#fff}.label{font-size:11px;color:#93a5c8}.log{height:165px;overflow:auto;padding:10px;border-radius:9px;background:#0d1320;border:1px solid #303e5d;font-size:12px;color:#b7c7e5;line-height:1.55}.side button{width:100%;margin-top:9px}.board-wrap{padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center}.floor-title{font-size:16px;font-weight:700;margin-bottom:12px;color:#dbe8ff}.board{--cell:min(6.1vw,52px);display:grid;grid-template-columns:repeat(10,var(--cell));grid-template-rows:repeat(12,var(--cell));gap:2px;background:#070a11;padding:5px;border-radius:10px;border:1px solid #56698f;box-shadow:0 10px 30px #0008}.tile{width:var(--cell);height:var(--cell);display:grid;place-items:center;font-size:calc(var(--cell)*.52);font-weight:800;border-radius:4px;user-select:none}.floor{background:#b7a47d;color:#263149}.wall{background:#354a67;color:#7d99c6}.door{background:#714b3e;color:#ffd265}.stairs{background:#596c4d;color:#dff5a5}.item{background:#8c6c38;color:#ffed87}.enemy{background:#633c51;color:#ff9fbc}.player{background:#3a75a3;color:#d9f1ff}.hint{margin-top:14px;color:#9eafd0;font-size:12px;text-align:center}.overlay{position:fixed;inset:0;background:#080b12cc;display:grid;place-items:center;padding:20px}.modal{max-width:540px;background:#1a2337;border:1px solid #526287;border-radius:14px;padding:24px;box-shadow:0 20px 70px #000b}.modal h2{margin-top:0}.modal p,.modal li{color:#b4c3df;line-height:1.65}.hidden{display:none!important}@media(max-width:740px){#app{padding:8px}.game{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #34425e}.log{height:100px}.board-wrap{padding:14px}.board{--cell:min(8.3vw,40px)}.card{border-radius:12px}}
  </style>
</head>
<body>
<main id="app"></main>
<script src="/wow/guest-probe.js"></script>
<script>
(() => {
  'use strict';
  const SAVE_KEY='magic-tower-wow-save-v1';
  const floors=[
    [
      '##########','#..K.....#','#.######.#','#.#...G..#','#.#.###..#','#...#....#','###.#.####','#...#..O.#','#.#####.##','#..+..D.>#','#....S...#','##########'
    ],
    [
      '##########','#..G...K.#','#.######.#','#.#....#.#','#.#.##...#','#...##...#','###.####.#','#..O....D#','#.######.#','#..+....>#','#....S...#','##########'
    ]
  ];
  const enemyBase={G:{name:'绿史莱姆',hp:22,atk:8,def:2,gold:3},O:{name:'兽人',hp:42,atk:15,def:5,gold:8}};
  let state=null;
  const app=document.querySelector('#app');
  const clone=(v)=>JSON.parse(JSON.stringify(v));
  function newState(){return {floor:0,x:1,y:1,hp:100,maxHp:100,atk:12,def:6,gold:0,keys:0,world:floors.map(rows=>rows.map(row=>row.split(''))),log:['勇士醒来于魔塔第一层。找到钥匙，打开门，向楼梯前进。']};}
  function save(){try{window.wowStorage.kv.setItem(SAVE_KEY,JSON.stringify(state))}catch(_){} }
  function load(){try{const raw=window.wowStorage.kv.getItem(SAVE_KEY);if(!raw)return null;const v=JSON.parse(raw);if(v&&v.world&&Array.isArray(v.world))return v}catch(_){}return null}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function pushLog(s){state.log.unshift(s);state.log=state.log.slice(0,18)}
  function tileChar(ch){return ({'#':'▦','.':'','K':'🔑','D':'🚪','>':'⇩','+':'✚','S':'⚔','G':'👾','O':'👹'})[ch]||''}
  function renderStart(){const has=!!load();app.innerHTML=`<section class="card"><header class="top"><div><div class="brand">WOW 两层迷宫演示</div><div class="sub">离线可玩 · 键盘与触控支持</div></div><div>⚔️</div></header><div class="start"><div class="tower">🏯</div><h1>两层迷宫演示</h1><p>WinOnWeb 自制的两层小游戏。击败怪物、收集钥匙和宝剑，穿过两层迷宫，抵达出口。</p><div class="actions"><button class="primary" id="new">开始新游戏</button>${has?'<button class="secondary" id="continue">继续游戏</button>':''}<button class="secondary" id="help">操作说明</button></div></div></section>`;document.querySelector('#new').onclick=()=>{state=newState();renderGame();save()};if(has)document.querySelector('#continue').onclick=()=>{state=load();renderGame()};document.querySelector('#help').onclick=showHelp}
  function renderGame(){const map=state.world[state.floor];app.innerHTML=`<section class="card"><header class="top"><div><div class="brand">WOW 两层迷宫演示</div><div class="sub">${state.floor+1} / ${floors.length} 层 · ${state.hp>0?'冒险进行中':'勇者已倒下'}</div></div><button class="secondary" id="menu">菜单</button></header><div class="game"><aside class="side"><div class="label">勇者状态</div><div class="stats"><div class="stat"><span class="label">生命</span><b>${state.hp}/${state.maxHp}</b></div><div class="stat"><span class="label">攻击</span><b>${state.atk}</b></div><div class="stat"><span class="label">防御</span><b>${state.def}</b></div><div class="stat"><span class="label">金币 / 钥匙</span><b>${state.gold} / ${state.keys}</b></div></div><div class="label">冒险记录</div><div class="log">${state.log.map(esc).join('<br>')}</div><button class="secondary" id="reset">重新开始</button><button class="secondary" id="how">操作说明</button></aside><section class="board-wrap"><div class="floor-title">魔塔第 ${state.floor+1} 层</div><div class="board" id="board">${map.map((row,y)=>row.map((ch,x)=>{const p=x===state.x&&y===state.y;const cls=p?'player':ch==='#'?'wall':ch==='G'||ch==='O'?'enemy':ch==='K'||ch==='+'||ch==='S'?'item':ch==='D'?'door':ch==='>'?'stairs':'floor';const display=p?'🧙':tileChar(ch);return `<div class="tile ${cls}" title="${x},${y}">${display}</div>`}).join('')).join('')}</div><div class="hint">方向键 / WASD 移动 · 走到怪物格战斗 · R 重置</div></section></div></section>`;document.querySelector('#menu').onclick=renderStart;document.querySelector('#reset').onclick=()=>{state=newState();renderGame();save()};document.querySelector('#how').onclick=showHelp;}
  function showHelp(){const el=document.createElement('div');el.className='overlay';el.innerHTML='<div class="modal"><h2>操作说明</h2><ul><li>使用方向键或 WASD 移动勇者。</li><li>走入怪物格会自动战斗，战斗结果取决于攻击和防御。</li><li>🔑 可以打开 🚪，⚔️ 提升攻击，✚ 恢复生命。</li><li>走到 ⇩ 进入下一层，通关后可以重新开始。</li><li>按 R 可重置当前冒险，存档保存在本机浏览器。</li></ul><button class="primary" id="close">知道了</button></div>';document.body.append(el);el.querySelector('#close').onclick=()=>el.remove()}
  function onKey(e){const k=e.key.toLowerCase();if(!state)return;if(k==='r'){state=newState();renderGame();save();return}const d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(d){e.preventDefault();move(d[0],d[1]);}}
  function move(dx,dy){if(!state||state.hp<=0)return;const nx=state.x+dx,ny=state.y+dy;const row=state.world[state.floor][ny];if(!row||row[nx]==='#'){pushLog('墙壁挡住了去路。');renderGame();save();return}let ch=row[nx];if(ch==='G'||ch==='O'){const e=enemyBase[ch];const damage=Math.max(1,e.atk-state.def);state.hp-=damage;pushLog(`与${e.name}战斗，受到 ${damage} 点伤害。`);if(state.hp<=0){state.hp=0;pushLog('勇者倒下了，按重新开始再试一次。');renderGame();save();return}state.gold+=e.gold;state.atk+=ch==='O'?2:1;row[nx]='.';pushLog(`击败${e.name}，获得 ${e.gold} 金币，攻击力提升。`)}else if(ch==='K'){state.keys++;row[nx]='.';pushLog('拾取一把金钥匙。')}else if(ch==='D'){if(state.keys<1){pushLog('这扇门需要一把钥匙。');renderGame();return}state.keys--;row[nx]='.';pushLog('使用钥匙打开了门。')}else if(ch==='+'){state.hp=Math.min(state.maxHp,state.hp+30);row[nx]='.';pushLog('喝下药水，恢复 30 点生命。')}else if(ch==='S'){state.atk+=8;row[nx]='.';pushLog('拾起宝剑，攻击力提升 8。')}else if(ch==='>'){if(state.floor+1>=state.world.length){state.log=['恭喜通关！你穿过魔塔，成为真正的勇者。',...state.log];renderVictory();save();return}state.floor++;state.x=1;state.y=1;pushLog(`踏上楼梯，进入第 ${state.floor+1} 层。`);renderGame();save();return}state.x=nx;state.y=ny;renderGame();save()}
  function renderVictory(){app.innerHTML=`<section class="card"><header class="top"><div><div class="brand">WOW 两层迷宫演示</div><div class="sub">冒险完成</div></div><div>🏆</div></header><div class="start"><div class="tower">🏆</div><h1>通关成功</h1><p>你击败了魔塔中的怪物，收集了宝剑和钥匙，成功抵达出口。</p><div class="actions"><button class="primary" id="again">再玩一次</button><button class="secondary" id="menu">返回菜单</button></div></div></section>`;document.querySelector('#again').onclick=()=>{state=newState();renderGame();save()};document.querySelector('#menu').onclick=renderStart}
  document.addEventListener('keydown',onKey);
  renderStart();
})();
</script>
</body>
</html>
